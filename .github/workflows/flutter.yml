name: Flutter

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN.
permissions:
  contents: read

defaults:
  run:
    working-directory: countit_app

jobs:
  checks:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: countit_app/coverage/lcov.info
          retention-days: 14

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK (local flavor)
        run: flutter build apk --debug --flavor local --dart-define-from-file=env/local.json
