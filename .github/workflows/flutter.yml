name: Flutter

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Actions are pinned by commit SHA (tags can be
# moved); Dependabot proposes updates.
permissions:
  contents: read

defaults:
  run:
    working-directory: countit_app

jobs:
  checks:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: countit_app/coverage/lcov.info
          retention-days: 14

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build APK (local flavor)
        run: flutter build apk --debug --flavor local --dart-define-from-file=env/local.json
