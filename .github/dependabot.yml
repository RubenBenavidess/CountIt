# Weekly update PRs; nothing is upgraded without a reviewed, green PR.
version: 2
updates:
  - package-ecosystem: pub
    directory: /countit_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
